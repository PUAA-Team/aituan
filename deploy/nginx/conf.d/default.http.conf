server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = / {
        root /usr/share/nginx/html/landing;
        try_files /index.html =404;
    }

    location = /favicon.png {
        root /usr/share/nginx/html/landing;
        try_files /favicon.png =404;
    }

    location = /web {
        return 301 /web/;
    }

    location = /web/ {
        root /usr/share/nginx/html;
        try_files /web/index.html =404;
    }

    location /web/ {
        root /usr/share/nginx/html;
        try_files $uri /web/index.html;
    }

    location = /merchant {
        return 301 /merchant/;
    }

    location = /merchant/ {
        root /usr/share/nginx/html;
        try_files /merchant/index.html =404;
    }

    location /merchant/ {
        root /usr/share/nginx/html;
        try_files $uri /merchant/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        root /usr/share/nginx/html;
        try_files /admin/index.html =404;
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri /admin/index.html;
    }

    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        try_files $uri =404;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
