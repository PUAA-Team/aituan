server {
    listen 80;
    server_name aituan.2b.gs;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aituan.2b.gs;

    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/aituan.2b.gs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aituan.2b.gs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = / {
        root /usr/share/nginx/html/landing;
        try_files /index.html =404;
    }

    location = /web {
        return 301 /web/;
    }

    location /web/ {
        alias /usr/share/nginx/html/web/;
        try_files $uri $uri/ /web/index.html;
    }

    location = /merchant {
        return 301 /merchant/;
    }

    location /merchant/ {
        alias /usr/share/nginx/html/merchant/;
        try_files $uri $uri/ /merchant/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        try_files $uri =404;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
