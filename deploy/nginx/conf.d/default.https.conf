server {
    listen 80;
    server_name aituan.2b.gs;

    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 保留 HTTP 健康检查，避免 CI/CD 本机探活被 301 跳转影响。
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aituan.2b.gs;

    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/aituan.2b.gs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aituan.2b.gs/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        root /usr/share/nginx/html/landing;
        try_files /index.html =404;
    }

    location = /favicon.png {
        root /usr/share/nginx/html/landing;
        try_files /favicon.png =404;
    }

    location = /web {
        return 301 /web/;
    }

    location = /web/ {
        root /usr/share/nginx/html;
        try_files /web/index.html =404;
    }

    location /web/ {
        root /usr/share/nginx/html;
        try_files $uri /web/index.html;
    }

    location = /merchant {
        return 301 /merchant/;
    }

    location = /merchant/ {
        root /usr/share/nginx/html;
        try_files /merchant/index.html =404;
    }

    location /merchant/ {
        root /usr/share/nginx/html;
        try_files $uri /merchant/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        root /usr/share/nginx/html;
        try_files /admin/index.html =404;
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri /admin/index.html;
    }

    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        try_files $uri =404;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
