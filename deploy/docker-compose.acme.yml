services:
  nginx:
    image: nginx:1.27-alpine
    container_name: aituan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.http.conf:/etc/nginx/conf.d/default.conf:ro
      - ${AITUAN_CERTBOT_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
      - ./artifacts/landing:/usr/share/nginx/html/landing:ro
      - ./artifacts/user-web:/usr/share/nginx/html/web:ro
      - ./artifacts/merchant-web:/usr/share/nginx/html/merchant:ro
      - ./artifacts/admin-web:/usr/share/nginx/html/admin:ro
      - ./artifacts/downloads:/usr/share/nginx/html/downloads:ro
    networks:
      - aituan

networks:
  aituan:
    external: true
    name: aituan-network
