name: aituan-microservices-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: microservices-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  microservice-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - merchant-catalog-service
          - api-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run service tests
        run: mvn -B -f services/pom.xml -pl ${{ matrix.service }} -am test

      - name: Package service jar
        run: mvn -B -f services/pom.xml -pl ${{ matrix.service }} -am -DskipTests package

      - name: Upload service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-reports
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: warn

      - name: Validate merchant-catalog Docker build
        if: matrix.service == 'merchant-catalog-service'
        run: docker build -f deploy/microservices/merchant-catalog-service/Dockerfile .

      - name: Validate merchant-catalog K8s manifest (dry-run)
        if: matrix.service == 'merchant-catalog-service'
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Dry-run apply merchant-catalog manifest
        if: matrix.service == 'merchant-catalog-service'
        run: kubectl apply --dry-run=client -f k8s/11-merchant-catalog-service.yaml
