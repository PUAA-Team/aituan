name: aituan-microservices-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microservices-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-test:
    name: Microservice test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-asset-service
          - merchant-catalog-service
          - trade-fulfillment-service
          - engagement-platform-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run service tests
        run: mvn -B -f services/pom.xml -pl ${{ matrix.service }} -am test

      - name: Package service jar
        run: mvn -B -f services/pom.xml -pl ${{ matrix.service }} -am -DskipTests package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-reports
          path: |
            services/${{ matrix.service }}/target/surefire-reports/**
            services/${{ matrix.service }}/target/failsafe-reports/**
          if-no-files-found: ignore
