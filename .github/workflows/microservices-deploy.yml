name: aituan-microservices-deploy

on:
  push:
    branches:
      - microservices-main
      - ms/merchant-catalog
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after image build
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: microservices-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'aituan' }}

jobs:
  merchant-catalog:
    name: Test, build, and optionally deploy merchant-catalog-service
    runs-on: ubuntu-latest
    outputs:
      image_registry: ${{ steps.meta.outputs.image_registry }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_registry="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          image_tag="sha-${GITHUB_SHA::7}"
          should_deploy="false"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.deploy }}" == "true" ]]; then
            should_deploy="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${{ vars.AUTO_DEPLOY_MICROSERVICES }}" == "true" ]]; then
            should_deploy="true"
          fi
          {
            echo "image_registry=${image_registry}"
            echo "image_tag=${image_tag}"
            echo "should_deploy=${should_deploy}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run merchant-catalog-service tests
        run: mvn -B -f services/pom.xml -pl merchant-catalog-service -am test

      - name: Package merchant-catalog-service jar
        run: mvn -B -f services/pom.xml -pl merchant-catalog-service -am -DskipTests package

      - name: Upload merchant-catalog-service test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merchant-catalog-service-deploy-test-reports
          path: services/merchant-catalog-service/target/surefire-reports/
          if-no-files-found: warn

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push merchant-catalog-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/microservices/merchant-catalog-service/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_registry }}/merchant-catalog-service:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_registry }}/merchant-catalog-service:microservices-main

  deploy-k8s:
    name: Deploy merchant-catalog-service to Kubernetes
    runs-on: ubuntu-latest
    needs: merchant-catalog
    if: needs.merchant-catalog.outputs.should_deploy == 'true'
    environment: production
    steps:
      - name: Checkout Kubernetes manifests
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            k8s
          sparse-checkout-cone-mode: true

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config current-context

      - name: Apply merchant-catalog-service manifest
        run: kubectl apply -f k8s/11-merchant-catalog-service.yaml

      - name: Deploy sha-tagged image
        shell: bash
        env:
          IMAGE_REGISTRY: ${{ needs.merchant-catalog.outputs.image_registry }}
          IMAGE_TAG: ${{ needs.merchant-catalog.outputs.image_tag }}
        run: |
          set -euo pipefail
          kubectl -n "${K8S_NAMESPACE}" set image deployment/merchant-catalog-service merchant-catalog-service="${IMAGE_REGISTRY}/merchant-catalog-service:${IMAGE_TAG}"

      - name: Wait for rollout and health
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/merchant-catalog-service --timeout=300s
          kubectl -n "${K8S_NAMESPACE}" run "merchant-catalog-health-${GITHUB_RUN_ID}" --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- \
            curl -fsS --max-time 10 http://merchant-catalog-service:8082/actuator/health

      - name: Dump Kubernetes diagnostics on failure
        if: failure()
        shell: bash
        run: |
          namespace="${K8S_NAMESPACE}"
          kubectl -n "${namespace}" get pods,svc,ingress,events || true
          kubectl -n "${namespace}" describe deployment/merchant-catalog-service || true
          kubectl -n "${namespace}" logs deployment/merchant-catalog-service --tail=120 || true
