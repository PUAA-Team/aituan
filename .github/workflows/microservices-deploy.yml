name: engagement-platform-deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Apply Kubernetes manifest after publishing the SHA image
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  K8S_NAMESPACE: aituan

jobs:
  test_build_push:
    name: Test, build, and publish engagement-platform-service
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run all service tests before publishing
        run: mvn -B -f services/pom.xml -pl engagement-platform-service -am verify

      - name: Compute immutable image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/engagement-platform-service" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SHA-tagged image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: deploy/microservices/engagement-platform-service/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}

      - name: Upload raw test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engagement-platform-deploy-test-reports
          path: services/engagement-platform-service/target/surefire-reports/
          if-no-files-found: error

  deploy:
    name: Deploy and verify engagement-platform-service
    needs: test_build_push
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply, update immutable image, and wait for rollout
        run: |
          set -euo pipefail
          kubectl apply -f k8s/13-engagement-platform-service.yaml
          kubectl -n "$K8S_NAMESPACE" set image deployment/engagement-platform-service \
            engagement-platform-service="${{ needs.test_build_push.outputs.image }}:${{ needs.test_build_push.outputs.tag }}"
          kubectl -n "$K8S_NAMESPACE" set env deployment/engagement-platform-service \
            AITUAN_IMAGE_TAG="${{ needs.test_build_push.outputs.tag }}"
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/engagement-platform-service --timeout=300s

      - name: Verify health inside the cluster
        run: |
          kubectl -n "$K8S_NAMESPACE" run engagement-platform-health-${GITHUB_RUN_ID} \
            --rm --restart=Never --image=curlimages/curl:8.12.1 \
            --command -- curl -fsS http://engagement-platform-service:8084/actuator/health

      - name: Collect rollout diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          kubectl -n "$K8S_NAMESPACE" get pods,svc,ingress,events -o wide > diagnostics/resources.txt || true
          kubectl -n "$K8S_NAMESPACE" describe deployment/engagement-platform-service > diagnostics/deployment.txt || true
          kubectl -n "$K8S_NAMESPACE" logs deployment/engagement-platform-service --tail=120 > diagnostics/logs.txt || true

      - name: Upload rollout diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engagement-platform-rollout-diagnostics
          path: diagnostics/
          if-no-files-found: warn
