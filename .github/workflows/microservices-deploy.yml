name: aituan-microservices-deploy

on:
  push:
    branches:
      - microservices-main
      - ms/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: microservices-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: aituan

jobs:
  build-test-image:
    name: Test and image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-asset-service
          - merchant-catalog-service
          - trade-fulfillment-service
          - engagement-platform-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_namespace="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${image_namespace}/${{ matrix.service }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run service tests
        run: mvn -B -f services/pom.xml -pl ${{ matrix.service }} -am test

      - name: Package service jar
        run: mvn -B -f services/pom.xml -pl ${{ matrix.service }} -am -DskipTests package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/microservices/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    name: Apply K8s and rollout
    runs-on: ubuntu-latest
    needs: build-test-image
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply manifests
        run: |
          set -euo pipefail
          kubectl apply -f k8s/10-identity-asset-service.yaml
          kubectl apply -f k8s/11-merchant-catalog-service.yaml || true
          kubectl apply -f k8s/12-trade-fulfillment-service.yaml || true
          kubectl apply -f k8s/13-engagement-platform-service.yaml || true

      - name: Update images and wait rollout
        shell: bash
        run: |
          set -euo pipefail
          image_namespace="${GITHUB_REPOSITORY,,}"
          image_tag="sha-${GITHUB_SHA::7}"
          for service in identity-asset-service merchant-catalog-service trade-fulfillment-service engagement-platform-service; do
            if kubectl -n "$NAMESPACE" get deployment "$service" >/dev/null 2>&1; then
              kubectl -n "$NAMESPACE" set image "deployment/$service" "$service=${REGISTRY}/${image_namespace}/${service}:${image_tag}"
              kubectl -n "$NAMESPACE" rollout status "deployment/$service" --timeout=180s
            fi
          done

      - name: Health checks
        shell: bash
        run: |
          set -euo pipefail
          for service in identity-asset-service merchant-catalog-service trade-fulfillment-service engagement-platform-service; do
            if kubectl -n "$NAMESPACE" get service "$service" >/dev/null 2>&1; then
              kubectl -n "$NAMESPACE" run "health-$service-${GITHUB_RUN_ID}" --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- \
                curl -fsS "http://${service}:$(case "$service" in identity-asset-service) echo 8081;; merchant-catalog-service) echo 8082;; trade-fulfillment-service) echo 8083;; engagement-platform-service) echo 8084;; esac)/actuator/health"
            fi
          done

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          kubectl -n "$NAMESPACE" get pods,svc,ingress,events
          kubectl -n "$NAMESPACE" describe deployment/identity-asset-service
          kubectl -n "$NAMESPACE" describe deployment/merchant-catalog-service
          kubectl -n "$NAMESPACE" describe deployment/trade-fulfillment-service
          kubectl -n "$NAMESPACE" describe deployment/engagement-platform-service
          kubectl -n "$NAMESPACE" logs deployment/identity-asset-service --tail=120
          kubectl -n "$NAMESPACE" logs deployment/merchant-catalog-service --tail=120
          kubectl -n "$NAMESPACE" logs deployment/trade-fulfillment-service --tail=120
          kubectl -n "$NAMESPACE" logs deployment/engagement-platform-service --tail=120
