name: aituan-microservices-deploy

on:
  workflow_run:
    workflows: [aituan-microservices-ci]
    types: [completed]
    branches: [main, microservices-main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: microservices-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  K8S_NAMESPACE: aituan
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  quality-gate:
    name: Full microservice quality gate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -f services/pom.xml clean test
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-quality-gate-reports
          path: services/**/target/surefire-reports/
          if-no-files-found: warn

  publish-images:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - identity-asset-service
          - merchant-catalog-service
          - trade-fulfillment-service
          - engagement-platform-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/microservices/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:sha-${{ env.DEPLOY_SHA }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:microservices

  deploy-kubernetes:
    name: Deploy and verify Kubernetes
    runs-on: ubuntu-latest
    needs: publish-images
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "${KUBE_CONFIG_DATA}"
          mkdir -p "$HOME/.kube"
          printf '%s' "${KUBE_CONFIG_DATA}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Apply topology and pin SHA images
        run: |
          kubectl apply -k k8s/microservices
          for service in api-gateway identity-asset-service merchant-catalog-service trade-fulfillment-service engagement-platform-service; do
            kubectl -n "${K8S_NAMESPACE}" set image "deployment/${service}" "${service}=${REGISTRY}/${GITHUB_REPOSITORY}/${service}:sha-${DEPLOY_SHA}"
          done
      - name: Wait for all rollouts
        run: |
          mkdir -p .aituan-local/deployment-report
          for service in api-gateway identity-asset-service merchant-catalog-service trade-fulfillment-service engagement-platform-service; do
            kubectl -n "${K8S_NAMESPACE}" rollout status "deployment/${service}" --timeout=300s
          done
          kubectl -n "${K8S_NAMESPACE}" get pods,svc,hpa -o wide > .aituan-local/deployment-report/resources.txt
      - name: Gateway health check
        run: |
          kubectl -n "${K8S_NAMESPACE}" port-forward service/api-gateway 18080:8080 > .aituan-local/deployment-report/port-forward.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/actuator/health && exit 0
            sleep 2
          done
          exit 1
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p .aituan-local/deployment-report
          kubectl -n "${K8S_NAMESPACE}" get events --sort-by=.lastTimestamp > .aituan-local/deployment-report/events.txt 2>&1 || true
          for service in api-gateway identity-asset-service merchant-catalog-service trade-fulfillment-service engagement-platform-service; do
            kubectl -n "${K8S_NAMESPACE}" describe "deployment/${service}" > ".aituan-local/deployment-report/${service}-describe.txt" 2>&1 || true
            kubectl -n "${K8S_NAMESPACE}" logs "deployment/${service}" --tail=200 > ".aituan-local/deployment-report/${service}.log" 2>&1 || true
          done
      - name: Upload deployment raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microservices-deployment-sha-${{ env.DEPLOY_SHA }}
          path: .aituan-local/deployment-report/
          if-no-files-found: warn
