name: aituan-identity-asset-deploy

on:
  push:
    branches:
      - microservices-main
      - ms/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: identity-asset-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NAMESPACE: aituan
  SERVICE: identity-asset-service

jobs:
  build-test-image:
    name: Test and image identity-asset-service
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_namespace="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${image_namespace}/${SERVICE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run identity service tests
        run: mvn -B -f services/pom.xml -pl identity-asset-service -am test

      - name: Package identity service jar
        run: mvn -B -f services/pom.xml -pl identity-asset-service -am -DskipTests package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push identity image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/microservices/identity-asset-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    name: Apply identity K8s and rollout
    runs-on: ubuntu-latest
    needs: build-test-image
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply identity manifest
        run: |
          set -euo pipefail
          kubectl apply -f k8s/10-identity-asset-service.yaml

      - name: Update identity image and wait rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" set image "deployment/$SERVICE" "$SERVICE=${{ needs.build-test-image.outputs.image }}"
          kubectl -n "$NAMESPACE" rollout status "deployment/$SERVICE" --timeout=180s

      - name: Identity health check
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" run "health-$SERVICE-${GITHUB_RUN_ID}" --rm -i --restart=Never --image=curlimages/curl:8.11.1 -- \
            curl -fsS "http://$SERVICE:8081/actuator/health"

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p k8s-diagnostics
          kubectl -n "$NAMESPACE" get pods,svc,ingress,events > k8s-diagnostics/resources.txt 2>&1
          kubectl -n "$NAMESPACE" describe deployment/identity-asset-service > k8s-diagnostics/deployment-identity-asset-service.txt 2>&1
          kubectl -n "$NAMESPACE" logs deployment/identity-asset-service --tail=200 > k8s-diagnostics/logs-identity-asset-service.txt 2>&1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: identity-k8s-diagnostics
          path: k8s-diagnostics/**
          if-no-files-found: ignore
