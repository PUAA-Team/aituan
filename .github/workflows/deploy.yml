name: aituan-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the production server after images are pushed
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_ORIGIN: ${{ vars.SERVER_ORIGIN || 'http://182.92.238.178' }}
  SERVER_APP_DIR: ${{ vars.SERVER_APP_DIR || '/opt/aituan/app' }}

jobs:
  build_and_push:
    name: Test, build, and push images
    runs-on: ubuntu-latest
    outputs:
      image_registry: ${{ steps.meta.outputs.image_registry }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_namespace="${GITHUB_REPOSITORY,,}"
          image_registry="${REGISTRY}/${image_namespace}"
          image_tag="sha-${GITHUB_SHA::7}"
          should_deploy="false"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.deploy }}" == "true" ]]; then
            should_deploy="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${{ vars.AUTO_DEPLOY_PRODUCTION }}" == "true" ]]; then
            should_deploy="true"
          fi
          {
            echo "image_registry=${image_registry}"
            echo "image_tag=${image_tag}"
            echo "should_deploy=${should_deploy}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: mvn -B -f services/backend/pom.xml test

      - name: Package backend jar
        run: |
          set -euo pipefail
          mvn -B -f services/backend/pom.xml -DskipTests package
          mkdir -p deploy/artifacts/backend
          cp services/backend/target/aituan-backend-0.0.1-SNAPSHOT.jar deploy/artifacts/backend/aituan-backend.jar

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/merchant_web/package-lock.json
            apps/admin_web/package-lock.json

      - name: Build merchant web
        env:
          VITE_API_BASE_URL: ${{ env.SERVER_ORIGIN }}
        run: |
          set -euo pipefail
          npm ci --prefix apps/merchant_web
          npm run build --prefix apps/merchant_web -- --base=/merchant/ --outDir "$GITHUB_WORKSPACE/deploy/artifacts/merchant-web" --emptyOutDir

      - name: Build admin web
        env:
          VITE_API_BASE_URL: ${{ env.SERVER_ORIGIN }}
        run: |
          set -euo pipefail
          npm ci --prefix apps/admin_web
          npm run build --prefix apps/admin_web -- --base=/admin/ --outDir "$GITHUB_WORKSPACE/deploy/artifacts/admin-web" --emptyOutDir

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Analyze and test Flutter app
        working-directory: apps/user_app
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Flutter web
        working-directory: apps/user_app
        run: flutter build web --base-href /web/ --dart-define=API_BASE_URL=${{ env.SERVER_ORIGIN }} --output "$GITHUB_WORKSPACE/deploy/artifacts/user-web"

      - name: Sync landing page
        run: |
          set -euo pipefail
          rm -rf deploy/artifacts/landing
          mkdir -p deploy/artifacts/landing
          cp -R deploy/landing/. deploy/artifacts/landing/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_registry }}/backend:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_registry }}/backend:main

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_registry }}/web:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_registry }}/web:main

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build_and_push
    if: needs.build_and_push.outputs.should_deploy == 'true'
    environment: production
    steps:
      - name: Checkout compose file
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/docker-compose.cicd.yml
          sparse-checkout-cone-mode: false

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/aituan_deploy_key
          chmod 600 ~/.ssh/aituan_deploy_key
          printf '%s\n' "${{ secrets.SERVER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload CI/CD compose file
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh_port="${SERVER_PORT:-22}"
          ssh -i ~/.ssh/aituan_deploy_key -p "$ssh_port" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${SERVER_APP_DIR}/deploy'"
          scp -i ~/.ssh/aituan_deploy_key -P "$ssh_port" deploy/docker-compose.cicd.yml "${SERVER_USER}@${SERVER_HOST}:${SERVER_APP_DIR}/deploy/docker-compose.cicd.yml"

      - name: Deploy images with Docker Compose
        shell: bash
        env:
          IMAGE_REGISTRY: ${{ needs.build_and_push.outputs.image_registry }}
          IMAGE_TAG: ${{ needs.build_and_push.outputs.image_tag }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh_port="${SERVER_PORT:-22}"
          ssh -i ~/.ssh/aituan_deploy_key -p "$ssh_port" "${SERVER_USER}@${SERVER_HOST}" \
            "set -eu; \
             cd '${SERVER_APP_DIR}'; \
             test -f deploy/.env; \
             mkdir -p /opt/aituan/backups; \
             cp deploy/.env \"/opt/aituan/backups/deploy.env.before-ci-${IMAGE_TAG}\"; \
             if grep -q '^AITUAN_IMAGE_REGISTRY=' deploy/.env; then sed -i 's|^AITUAN_IMAGE_REGISTRY=.*|AITUAN_IMAGE_REGISTRY=${IMAGE_REGISTRY}|' deploy/.env; else printf '\nAITUAN_IMAGE_REGISTRY=${IMAGE_REGISTRY}\n' >> deploy/.env; fi; \
             if grep -q '^AITUAN_IMAGE_TAG=' deploy/.env; then sed -i 's|^AITUAN_IMAGE_TAG=.*|AITUAN_IMAGE_TAG=${IMAGE_TAG}|' deploy/.env; else printf '\nAITUAN_IMAGE_TAG=${IMAGE_TAG}\n' >> deploy/.env; fi; \
             if ! grep -q '^AITUAN_DOWNLOADS_DIR=' deploy/.env; then printf '\nAITUAN_DOWNLOADS_DIR=/opt/aituan/data/downloads\n' >> deploy/.env; fi; \
             mkdir -p /opt/aituan/data/downloads; \
             docker compose --env-file deploy/.env -f deploy/docker-compose.cicd.yml pull; \
             docker compose --env-file deploy/.env -f deploy/docker-compose.cicd.yml up -d --remove-orphans; \
             for i in \$(seq 1 24); do \
               if curl -fsS http://127.0.0.1/actuator/health; then exit 0; fi; \
               echo \"waiting for backend health... attempt \$i/24\"; \
               sleep 5; \
             done; \
             docker compose --env-file deploy/.env -f deploy/docker-compose.cicd.yml logs --tail=120 backend; \
             exit 1"
