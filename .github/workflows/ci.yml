name: aituan-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_API_BASE_URL: http://127.0.0.1

jobs:
  static-regression:
    name: Static regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run member E regression checks
        run: bash scripts/verify/member_e_regression_checks.sh

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: aituan_test
          MYSQL_USER: aituan
          MYSQL_PASSWORD: aituan_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests with coverage
        run: mvn -B -f services/backend/pom.xml verify

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-jacoco-report
          path: services/backend/target/site/jacoco
          if-no-files-found: warn

      - name: Verify Flyway migrations on MySQL 8
        env:
          AITUAN_MYSQL_CI_ENABLED: 'true'
          AITUAN_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/aituan_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          AITUAN_DATASOURCE_USERNAME: aituan
          AITUAN_DATASOURCE_PASSWORD: aituan_password
        run: mvn -B -f services/backend/pom.xml -Dtest=MysqlMigrationSmokeTest test

  web:
    name: Web build (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: merchant
            path: apps/merchant_web
            base: /merchant/
            out: deploy/artifacts/merchant-web
          - name: admin
            path: apps/admin_web
            base: /admin/
            out: deploy/artifacts/admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/merchant_web/package-lock.json
            apps/admin_web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.app.path }}

      - name: Run ${{ matrix.app.name }} web tests with coverage
        env:
          VITE_API_BASE_URL: ${{ env.CI_API_BASE_URL }}
        run: npm run test:coverage --prefix ${{ matrix.app.path }}

      - name: Upload ${{ matrix.app.name }} web coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app.name }}-web-coverage
          path: ${{ matrix.app.path }}/coverage
          if-no-files-found: warn

      - name: Build ${{ matrix.app.name }} web
        env:
          VITE_API_BASE_URL: ${{ env.CI_API_BASE_URL }}
        run: npm run build --prefix ${{ matrix.app.path }} -- --base=${{ matrix.app.base }} --outDir "$GITHUB_WORKSPACE/${{ matrix.app.out }}" --emptyOutDir

  flutter:
    name: Flutter analyze, tests, and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: apps/user_app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/user_app
        run: flutter analyze

      - name: Run Flutter tests with coverage
        working-directory: apps/user_app
        run: flutter test --coverage

      - name: Upload Flutter coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-app-flutter-coverage
          path: apps/user_app/coverage/lcov.info
          if-no-files-found: warn

      - name: Run Flutter integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: apps/user_app
          script: flutter test integration_test -d emulator-5554

      - name: Build Flutter web
        working-directory: apps/user_app
        run: >
          flutter build web
          --base-href /web/
          --dart-define=API_BASE_URL=${{ env.CI_API_BASE_URL }}
          --dart-define=AITUAN_BUILD_COMMIT=${{ github.sha }}
          --dart-define=AITUAN_BUILD_SOURCE=github-actions
          --output "$GITHUB_WORKSPACE/deploy/artifacts/user-web"
