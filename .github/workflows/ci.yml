name: aituan-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_API_BASE_URL: http://127.0.0.1

jobs:
  static-regression:
    name: Static regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run member E regression checks
        run: bash scripts/verify/member_e_regression_checks.sh

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests and coverage
        run: mvn -B -f services/backend/pom.xml org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.12:report

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/backend/target/surefire-reports/
            services/backend/target/site/jacoco/
          if-no-files-found: warn

  web:
    name: Web build (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: merchant
            path: apps/merchant_web
            base: /merchant/
            out: deploy/artifacts/merchant-web
          - name: admin
            path: apps/admin_web
            base: /admin/
            out: deploy/artifacts/admin-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/merchant_web/package-lock.json
            apps/admin_web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.app.path }}

      - name: Run ${{ matrix.app.name }} web tests
        env:
          VITE_API_BASE_URL: ${{ env.CI_API_BASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p ${{ matrix.app.path }}/test-results
          npm test --prefix ${{ matrix.app.path }} -- --reporter=default --reporter=junit --outputFile=./test-results/vitest.xml

      - name: Upload ${{ matrix.app.name }} web test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-web-test-reports
          path: ${{ matrix.app.path }}/test-results/
          if-no-files-found: warn

      - name: Build ${{ matrix.app.name }} web
        env:
          VITE_API_BASE_URL: ${{ env.CI_API_BASE_URL }}
        run: npm run build --prefix ${{ matrix.app.path }} -- --base=${{ matrix.app.base }} --outDir "$GITHUB_WORKSPACE/${{ matrix.app.out }}" --emptyOutDir

  flutter:
    name: Flutter analyze, tests, and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: apps/user_app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/user_app
        run: flutter analyze

      - name: Run Flutter tests with coverage
        working-directory: apps/user_app
        run: |
          set -euo pipefail
          mkdir -p test-results
          flutter test --coverage --machine > test-results/flutter-test.json

      - name: Upload Flutter test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-reports
          path: |
            apps/user_app/test-results/
            apps/user_app/coverage/
          if-no-files-found: warn

      - name: Build Flutter web
        working-directory: apps/user_app
        run: >
          flutter build web
          --base-href /web/
          --dart-define=API_BASE_URL=${{ env.CI_API_BASE_URL }}
          --dart-define=AITUAN_BUILD_COMMIT=${{ github.sha }}
          --dart-define=AITUAN_BUILD_SOURCE=github-actions
          --output "$GITHUB_WORKSPACE/deploy/artifacts/user-web"

  e2e:
    name: E2E business scenarios (UC01-UC13)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aituan_e2e
          MYSQL_USER: aituan_e2e
          MYSQL_PASSWORD: aituan_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uaituan_e2e -paituan_e2e --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      E2E_API_ORIGIN: http://127.0.0.1:8080
      E2E_WEB_ORIGIN: http://127.0.0.1:8090
      E2E_ARTIFACTS_ROOT: ${{ github.workspace }}/.aituan-local/e2e/web
      VITE_API_BASE_URL: http://127.0.0.1:8090
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package backend jar
        run: |
          set -euo pipefail
          mvn -B -f services/backend/pom.xml -DskipTests package
          mkdir -p .aituan-local/e2e/backend
          cp services/backend/target/aituan-backend-*.jar .aituan-local/e2e/backend/aituan-backend-e2e.jar

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/merchant_web/package-lock.json
            apps/admin_web/package-lock.json
            tests/e2e/package-lock.json

      - name: Build merchant web
        run: |
          set -euo pipefail
          npm ci --prefix apps/merchant_web
          npm run build --prefix apps/merchant_web -- --base=/merchant/ --outDir "$GITHUB_WORKSPACE/.aituan-local/e2e/web/merchant" --emptyOutDir

      - name: Build admin web
        run: |
          set -euo pipefail
          npm ci --prefix apps/admin_web
          npm run build --prefix apps/admin_web -- --base=/admin/ --outDir "$GITHUB_WORKSPACE/.aituan-local/e2e/web/admin" --emptyOutDir

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Build user Flutter web
        working-directory: apps/user_app
        run: |
          set -euo pipefail
          flutter pub get
          flutter build web
            --base-href /web/
            --dart-define=API_BASE_URL=http://127.0.0.1:8090
            --dart-define=AITUAN_BUILD_COMMIT=${{ github.sha }}
            --dart-define=AITUAN_BUILD_SOURCE=github-actions-e2e
            --output "$GITHUB_WORKSPACE/.aituan-local/e2e/web/web"

      - name: Install E2E dependencies and browsers
        working-directory: tests/e2e
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Start backend (e2e profile + MySQL)
        env:
          AITUAN_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/aituan_e2e?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          AITUAN_DATASOURCE_USERNAME: aituan_e2e
          AITUAN_DATASOURCE_PASSWORD: aituan_e2e
          AITUAN_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
        run: |
          set -euo pipefail
          nohup java -jar .aituan-local/e2e/backend/aituan-backend-e2e.jar \
            --spring.profiles.active=e2e \
            --server.port=8080 > .aituan-local/e2e/backend.out.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/open/auth/token/check; then
              exit 0
            fi
            echo "waiting for backend... $i/60"
            sleep 3
          done
          cat .aituan-local/e2e/backend.out.log
          exit 1

      - name: Start static server
        working-directory: tests/e2e
        run: |
          set -euo pipefail
          nohup node scripts/static-server.mjs > "$GITHUB_WORKSPACE/.aituan-local/e2e/server.out.log" 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:8090/web/ > /dev/null
          curl -fsS http://127.0.0.1:8090/merchant/ > /dev/null
          curl -fsS http://127.0.0.1:8090/admin/ > /dev/null

      - name: Run E2E tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-uc01-uc13
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
