server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: engagement-platform-service
  datasource:
    url: ${AITUAN_PLATFORM_DATASOURCE_URL:${AITUAN_DATASOURCE_URL:jdbc:h2:mem:aituan_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}}
    username: ${AITUAN_PLATFORM_DATASOURCE_USERNAME:${AITUAN_DATASOURCE_USERNAME:sa}}
    password: ${AITUAN_PLATFORM_DATASOURCE_PASSWORD:${AITUAN_DATASOURCE_PASSWORD:}}
    driver-class-name: ${AITUAN_PLATFORM_DATASOURCE_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration/platform,classpath:db/seed/platform
    clean-disabled: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${AITUAN_UPLOAD_MAX_SIZE_BYTES:5MB}
      max-request-size: ${AITUAN_UPLOAD_MAX_SIZE_BYTES:5MB}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
    git:
      mode: simple

info:
  app:
    name: ${spring.application.name}
    version: ${AITUAN_SERVICE_VERSION:0.0.1-SNAPSHOT}
    image-tag: ${AITUAN_IMAGE_TAG:local}
    active-profile: ${spring.profiles.active:default}

aituan:
  internal:
    service-token: ${AITUAN_INTERNAL_SERVICE_TOKEN:dev-internal-token}
  security:
    jwt-secret: ${AITUAN_JWT_SECRET:aituan-demo-secret-change-me}
    jwt-ttl-seconds: ${AITUAN_JWT_TTL_SECONDS:2592000}
  clients:
    connect-timeout-ms: ${AITUAN_CLIENT_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${AITUAN_CLIENT_READ_TIMEOUT_MS:1500}
    identity-base-url: ${AITUAN_IDENTITY_BASE_URL:http://localhost:8081}
    merchant-base-url: ${AITUAN_MERCHANT_BASE_URL:http://localhost:8082}
    trade-base-url: ${AITUAN_TRADE_BASE_URL:http://localhost:8083}
  compensation:
    review-order-mark:
      initial-delay-ms: ${AITUAN_REVIEW_COMPENSATION_INITIAL_DELAY_MS:30000}
      fixed-delay-ms: ${AITUAN_REVIEW_COMPENSATION_FIXED_DELAY_MS:60000}
      batch-size: ${AITUAN_REVIEW_COMPENSATION_BATCH_SIZE:50}
      max-attempts: ${AITUAN_REVIEW_COMPENSATION_MAX_ATTEMPTS:10}
      lock-timeout-seconds: ${AITUAN_REVIEW_COMPENSATION_LOCK_TIMEOUT_SECONDS:300}
  upload:
    strategy: ${AITUAN_UPLOAD_STRATEGY:local}
    root-dir: ${AITUAN_UPLOAD_ROOT:${user.home}/.aituan/platform-uploads}
    public-prefix: ${AITUAN_UPLOAD_PUBLIC_PREFIX:/api/common/files}
    max-size-bytes: ${AITUAN_UPLOAD_MAX_SIZE_BYTES:5242880}
    lskypro:
      api-url: ${AITUAN_UPLOAD_LSKYPRO_API_URL:https://p.2b.gs/api/v1}
      token: ${AITUAN_UPLOAD_LSKYPRO_TOKEN:}
      strategy-id: ${AITUAN_UPLOAD_LSKYPRO_STRATEGY_ID:}
      album-id: ${AITUAN_UPLOAD_LSKYPRO_ALBUM_ID:}
      permission: ${AITUAN_UPLOAD_LSKYPRO_PERMISSION:1}
  ai:
    enabled: ${AITUAN_AI_ENABLED:false}
    api-url: ${AITUAN_AI_API_URL:http://cliapi.2b.gs}
    api-key: ${AITUAN_AI_API_KEY:}
    model: ${AITUAN_AI_MODEL:pp/gpt-5.5}
    timeout-seconds: ${AITUAN_AI_TIMEOUT_SECONDS:20}
    max-tokens: ${AITUAN_AI_MAX_TOKENS:800}
    temperature: ${AITUAN_AI_TEMPERATURE:0.25}
