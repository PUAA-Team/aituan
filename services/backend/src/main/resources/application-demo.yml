spring:
  datasource:
    url: jdbc:h2:mem:aituan_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    baseline-on-migrate: true

logging:
  level:
    com.aituan: INFO
