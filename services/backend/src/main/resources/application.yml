server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aituan-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    clean-disabled: true
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

aituan:
  security:
    jwt-secret: ${AITUAN_JWT_SECRET:aituan-demo-secret-change-me}
    jwt-ttl-seconds: ${AITUAN_JWT_TTL_SECONDS:604800}
  upload:
    root-dir: ${AITUAN_UPLOAD_ROOT:D:/aituan_runtime/uploads}
    public-prefix: ${AITUAN_UPLOAD_PUBLIC_PREFIX:/api/common/files}
    max-size-bytes: ${AITUAN_UPLOAD_MAX_SIZE_BYTES:5242880}
