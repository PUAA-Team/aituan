# 端到端测试专用 profile：本地默认使用 H2，CI 通过环境变量切换到 MySQL 8。
spring:
  datasource:
    url: ${AITUAN_DATASOURCE_URL:jdbc:h2:mem:aituan_e2e;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${AITUAN_DATASOURCE_USERNAME:sa}
    password: ${AITUAN_DATASOURCE_PASSWORD:}
    driver-class-name: ${AITUAN_DATASOURCE_DRIVER:org.h2.Driver}
  flyway:
    baseline-on-migrate: true

logging:
  level:
    com.aituan: INFO

aituan:
  mail:
    enabled: false
    debug-return-code: true
  ai:
    enabled: false
  trade:
    delivery-tick-ms: ${AITUAN_E2E_DELIVERY_TICK_MS:3600000}

management:
  health:
    mail:
      enabled: false
