apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aituan-downloads
  namespace: aituan
  labels:
    app.kubernetes.io/name: aituan-web
    app.kubernetes.io/part-of: aituan
    app.kubernetes.io/component: downloads
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: aituan
  labels:
    app.kubernetes.io/name: aituan-web
    app.kubernetes.io/part-of: aituan
    app.kubernetes.io/component: frontend
spec:
  # 单节点 k3s 通过内置 servicelb 直接接管服务器 80/443，避免额外安装 Ingress Controller。
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
  selector:
    app.kubernetes.io/name: aituan-web
    app.kubernetes.io/part-of: aituan
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aituan-web
  namespace: aituan
  labels:
    app.kubernetes.io/name: aituan-web
    app.kubernetes.io/part-of: aituan
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: aituan-web
      app.kubernetes.io/part-of: aituan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aituan-web
        app.kubernetes.io/part-of: aituan
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/puaa-team/aituan/web:sha-example
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          env:
            - name: NGINX_SERVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: NGINX_SERVER_NAME
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: TZ
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          volumeMounts:
            - name: downloads
              mountPath: /usr/share/nginx/html/downloads
              readOnly: true
            - name: tls-cert
              mountPath: /etc/letsencrypt/live/aituan.2b.gs
              readOnly: true
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: aituan-downloads
        - name: tls-cert
          secret:
            secretName: aituan-tls
            items:
              - key: tls.crt
                path: fullchain.pem
              - key: tls.key
                path: privkey.pem
