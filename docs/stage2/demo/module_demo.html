<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>爱团-模块展示</title>
  <link rel="stylesheet" href="./demo.css" />
</head>
<body>
  <div class="page-wrap">
    <div class="phone">
      <div class="status-bar"></div>
      <div class="topbar">
        <div class="row">
          <a class="back-btn" href="./home_demo.html">‹</a>
          <div style="flex:1;"><div class="topbar-title">团购</div><div class="topbar-subtitle">附近口碑套餐和到店服务</div></div>
          <a class="pill" href="./search_demo.html">搜索</a>
        </div>
        <a class="search-box" href="./search_demo.html" style="margin-top: 12px;">搜索团购、酒店、门票、洗脚</a>
      </div>
      <div class="content no-tab">
        <div class="card module-hero">
          <div class="row" style="align-items:flex-start;">
            <div><div class="small muted">今日推荐</div><div class="title" style="font-size:20px; margin-top:4px;">北航周边精选套餐</div><div class="subline">双人餐、电影票、放松服务，今天可用</div></div>
            <span class="tag red">爱团优选</span>
          </div>
        </div>
        <div class="card">
          <div class="card-title">热门推荐</div>
          <div class="hit-grid">
            <a class="hit-card" href="./item_detail_demo.html"><div class="thumb"></div><div class="hit-body"><div class="tiny">江南小馆双人餐</div><div class="price" style="font-size:15px;"><small>￥</small>98</div></div></a>
            <a class="hit-card" href="./item_detail_demo.html"><div class="thumb"></div><div class="hit-body"><div class="tiny">光影夜场电影票</div><div class="price" style="font-size:15px;"><small>￥</small>45</div></div></a>
            <a class="hit-card" href="./item_detail_demo.html"><div class="thumb"></div><div class="hit-body"><div class="tiny">洗脚按摩 60 分钟</div><div class="price" style="font-size:15px;"><small>￥</small>128</div></div></a>
          </div>
        </div>
        <div class="row" style="margin: 12px 0 10px;"><div class="title">附近推荐</div><div class="small muted">持续更新</div></div>
        <div class="feed-list" id="moduleFeed">
          <a class="card list-item" href="./item_detail_demo.html"><div class="thumb"></div><div style="flex:1;"><div class="title">江南小馆双人套餐</div><div class="subline">900m · 周末可用 · 已售 2882</div><div class="row" style="margin-top:8px;"><div class="price"><small>￥</small>98</div><span class="tag gray">团购</span></div></div></a>
          <a class="card list-item" href="./item_detail_demo.html"><div class="thumb"></div><div style="flex:1;"><div class="title">雅境洗脚按摩 60 分钟</div><div class="subline">1.4km · 到店核销 · 可预约</div><div class="row" style="margin-top:8px;"><div class="price"><small>￥</small>128</div><span class="tag green">洗脚</span></div></div></a>
          <a class="card list-item" href="./item_detail_demo.html"><div class="thumb"></div><div style="flex:1;"><div class="title">城市观影通兑票</div><div class="subline">今日可用 · 余票充足 · 支持退</div><div class="row" style="margin-top:8px;"><div class="price"><small>￥</small>45</div><span class="tag gray">电影演出</span></div></div></a>
          <a class="card list-item" href="./item_detail_demo.html"><div class="thumb"></div><div style="flex:1;"><div class="title">轻氧健身体验课</div><div class="subline">1.5km · 教练带练 · 需预约</div><div class="row" style="margin-top:8px;"><div class="price"><small>￥</small>39.9</div><span class="tag red">休闲娱乐</span></div></div></a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
