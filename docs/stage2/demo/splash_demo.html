<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>爱团-启动页</title>
  <link rel="stylesheet" href="./demo.css" />
  <style>
    .splash { min-height: 816px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 28px; background: var(--bg-brand-soft); }
    .logo { width: 86px; height: 86px; border-radius: 22px; background: var(--brand); border: 1px solid var(--brand-strong); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; color: #fff; }
    .splash h1 { margin: 18px 0 8px; font-size: 30px; }
    .splash-actions { width: 100%; margin-top: 36px; display: grid; gap: 10px; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="phone">
      <div class="status-bar"></div>
      <div class="splash">
        <div class="logo">爱</div>
        <h1>爱团</h1>
        <div class="small muted">吃喝玩乐，一键触达</div>
        <div class="splash-actions">
          <a class="btn btn-primary" href="./login_demo.html">登录 / 注册</a>
          <a class="btn btn-light" href="./home_demo.html">游客进入首页</a>
          <a class="btn btn-secondary" href="./index.html">返回页面目录</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
