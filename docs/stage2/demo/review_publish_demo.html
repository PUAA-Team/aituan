<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>爱团-发布评价</title>
  <link rel="stylesheet" href="./demo.css" />
</head>
<body>
  <div class="page-wrap">
    <div class="phone">
      <div class="status-bar"></div>
      <div class="topbar"><div class="row"><a class="back-btn" href="./order_detail_demo.html">‹</a><div class="topbar-title">发布评价</div><span></span></div></div>
