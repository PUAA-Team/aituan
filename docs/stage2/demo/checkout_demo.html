<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>爱团-确认订单</title>
  <link rel="stylesheet" href="./demo.css" />
</head>
<body>
  <div class="page-wrap">
    <div class="phone">
      <div class="status-bar"></div>
      <div class="topbar"><div class="row"><a class="back-btn" href="./item_detail_demo.html">‹</a><div class="topbar-title">确认订单</div><span></span></div></div>
      <div class="content">
        <div class="segment"><button class="btn btn-primary">到店核销</button><button class="btn btn-light">外卖配送</button></div>
        <div class="card"><div class="row"><div><div class="card-title" style="margin-bottom: 4px;">使用信息</div><div class="title" style="font-size: 14px;">张同学 13800138000</div></div><span class="link-text">修改</span></div><div class="subline">支付成功后生成二维码和券码号，到店出示即可核销。</div><div class="tag green" style="margin-top: 8px;">未使用可退</div></div>
        <div class="card"><div class="card-title">江南小馆</div><div class="list-item"><div class="thumb"></div><div style="flex:1;"><div class="title">江南小馆双人套餐</div><div class="subline">周末可用 · 到店核销</div><div class="row" style="margin-top: 8px;"><div class="price"><small>￥</small>98</div><span class="small muted">x1</span></div></div></div></div>
        <div class="card"><div class="row"><div><div class="card-title" style="margin-bottom:4px;">优惠券</div><div class="small muted">平台新人券</div></div><span class="tag">已选择 -￥10</span></div></div>
        <div class="card"><div class="card-title">支付方式</div><label class="row" style="padding: 10px 0;"><div><div class="title" style="font-size:14px;">模拟支付</div><div class="subline">当前阶段直接支付成功，后续可扩展微信 / 支付宝</div></div><input type="radio" checked /></label></div>
        <div class="card"><div class="card-title">订单备注</div><div class="search-box">如需预约，请提前电话确认</div></div>
        <div class="card"><div class="card-title">金额明细</div><div class="kv"><span>商品金额</span><span>￥108</span></div><div class="kv"><span>配送费</span><span>￥0</span></div><div class="kv"><span>服务费</span><span>￥0</span></div><div class="kv"><span>优惠抵扣</span><span>-￥10</span></div><div class="kv" style="padding-top:10px; border-top:1px solid #eef2f5; font-weight:800;"><span>应付金额</span><span>￥98</span></div></div>
        <div class="card"><div class="card-title">核销说明</div><div class="subline">支付成功后可在订单详情查看二维码和券码号。</div></div>
      </div>
      <div class="bottom-bar"><div class="row"><div><div class="small muted">模拟支付</div><div class="price"><small>￥</small>98</div></div><a class="btn btn-primary" href="./service_order_detail_demo.html" style="min-width: 132px;">提交并支付</a></div></div>
    </div>
  </div>
</body>
</html>
