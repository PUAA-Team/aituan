apiVersion: v1
kind: Pod
metadata:
  name: performance-load-generator
  namespace: aituan
  labels:
    app.kubernetes.io/name: performance-load-generator
    app.kubernetes.io/part-of: aituan-performance
spec:
  restartPolicy: Never
  containers:
    - name: load-generator
      image: node:22-bookworm-slim
      imagePullPolicy: Never
      envFrom:
        - configMapRef:
            name: aituan-performance-runtime
      command:
        - /bin/sh
        - -ec
      args:
        - >-
          exec node /performance/run/load-test.mjs
          --target monolith=http://performance-monolith:8080
          --pids monolith=${MONOLITH_PIDS}
          --target microservices=http://api-gateway:8080
          --pids microservices=${MICROSERVICE_PIDS}
          --runs ${RUNS}
          --concurrency ${CONCURRENCY}
          --requests ${REQUESTS}
          --warmup-requests ${WARMUP_REQUESTS}
          --resource-interval-ms ${RESOURCE_INTERVAL_MS}
          --cooldown-ms ${COOLDOWN_MS}
          --proc-root /host-proc
          --scenarios /performance/run/scenarios.json
          --output /performance/evidence/${OUTPUT_NAME}
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 512Mi
      volumeMounts:
        - name: performance-work
          mountPath: /performance
        - name: host-proc
          mountPath: /host-proc
          readOnly: true
  volumes:
    - name: performance-work
      hostPath:
        path: /tmp/aituan-performance
        type: Directory
    - name: host-proc
      hostPath:
        path: /proc
        type: Directory
