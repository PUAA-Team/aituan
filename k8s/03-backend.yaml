apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aituan-uploads
  namespace: aituan
  labels:
    app.kubernetes.io/name: aituan-backend
    app.kubernetes.io/part-of: aituan
    app.kubernetes.io/component: uploads
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aituan
  labels:
    app.kubernetes.io/name: aituan-backend
    app.kubernetes.io/part-of: aituan
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: aituan-backend
    app.kubernetes.io/part-of: aituan
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aituan-backend
  namespace: aituan
  labels:
    app.kubernetes.io/name: aituan-backend
    app.kubernetes.io/part-of: aituan
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: aituan-backend
      app.kubernetes.io/part-of: aituan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aituan-backend
        app.kubernetes.io/part-of: aituan
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: ghcr.io/puaa-team/aituan/backend:sha-example
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: MYSQL_DATABASE
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: SERVER_PORT
            - name: AITUAN_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/$(MYSQL_DATABASE)?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
            - name: AITUAN_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: aituan-db-secret
                  key: MYSQL_USER
            - name: AITUAN_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aituan-db-secret
                  key: MYSQL_PASSWORD
            - name: AITUAN_CONFIG_FILE
              value: /app/.config
            - name: AITUAN_UPLOAD_ROOT
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: AITUAN_UPLOAD_ROOT
            - name: AITUAN_UPLOAD_PUBLIC_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: AITUAN_UPLOAD_PUBLIC_PREFIX
            - name: MANAGEMENT_HEALTH_MAIL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: MANAGEMENT_HEALTH_MAIL_ENABLED
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: JAVA_TOOL_OPTIONS
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: TZ
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
            - name: app-config
              mountPath: /app/.config
              subPath: .config
              readOnly: true
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: aituan-uploads
        - name: app-config
          secret:
            secretName: aituan-app-config
