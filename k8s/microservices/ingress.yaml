apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aituan-api
  namespace: aituan
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: api-gateway, port: {name: http}}
