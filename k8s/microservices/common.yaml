apiVersion: v1
kind: Namespace
metadata:
  name: aituan
  labels:
    app.kubernetes.io/name: aituan
    app.kubernetes.io/part-of: aituan
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aituan-microservices-config
  namespace: aituan
data:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_CONFIG_IMPORT: optional:file:/app/.config[.properties]
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "1"
  SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT: "3000"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
  TZ: Asia/Shanghai
  NGINX_SERVER_NAME: aituan.2b.gs
  IDENTITY_ASSET_SERVICE_URL: http://identity-asset-service:8081
  MERCHANT_CATALOG_SERVICE_URL: http://merchant-catalog-service:8082
  TRADE_FULFILLMENT_SERVICE_URL: http://trade-fulfillment-service:8083
  ENGAGEMENT_PLATFORM_SERVICE_URL: http://engagement-platform-service:8084
