apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: aituan}
spec:
  selector: {app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: aituan}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: aituan}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: aituan}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: aituan, app.kubernetes.io/component: gateway}
    spec:
      imagePullSecrets: [{name: ghcr-pull-secret}]
      containers:
        - name: api-gateway
          image: ghcr.io/puaa-team/aituan/api-gateway:sha-placeholder
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: aituan-microservices-config}}]
          env:
            - {name: SERVER_PORT, value: "8080"}
            - name: IDENTITY_ASSET_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: aituan-microservices-config, key: IDENTITY_ASSET_SERVICE_URL}}
            - name: MERCHANT_CATALOG_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: aituan-microservices-config, key: MERCHANT_CATALOG_SERVICE_URL}}
            - name: TRADE_FULFILLMENT_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: aituan-microservices-config, key: TRADE_FULFILLMENT_SERVICE_URL}}
            - name: ENGAGEMENT_PLATFORM_SERVICE_URL
              valueFrom: {configMapKeyRef: {name: aituan-microservices-config, key: ENGAGEMENT_PLATFORM_SERVICE_URL}}
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              valueFrom: {configMapKeyRef: {name: aituan-microservices-config, key: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED}}
            - {name: AITUAN_IMAGE_TAG, value: sha-placeholder}
          startupProbe: &gatewayProbe {httpGet: {path: /actuator/health, port: http}, timeoutSeconds: 3, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: *gatewayProbe
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, initialDelaySeconds: 30, timeoutSeconds: 3, failureThreshold: 5, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
