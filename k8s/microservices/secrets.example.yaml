# 字段示例；不要直接用于生产，也不要提交真实密钥。
apiVersion: v1
kind: Secret
metadata: {name: aituan-mysql-root-secret, namespace: aituan}
type: Opaque
stringData: {password: replace-root-password}
---
apiVersion: v1
kind: Secret
metadata: {name: aituan-identity-db-secret, namespace: aituan}
type: Opaque
stringData: {username: aituan_identity_svc, password: replace-identity-password}
---
apiVersion: v1
kind: Secret
metadata: {name: aituan-merchant-db-secret, namespace: aituan}
type: Opaque
stringData: {username: aituan_merchant_svc, password: replace-merchant-password}
---
apiVersion: v1
kind: Secret
metadata: {name: aituan-trade-db-secret, namespace: aituan}
type: Opaque
stringData: {username: aituan_trade_svc, password: replace-trade-password}
---
apiVersion: v1
kind: Secret
metadata: {name: aituan-platform-db-secret, namespace: aituan}
type: Opaque
stringData: {username: aituan_platform_svc, password: replace-platform-password}
---
apiVersion: v1
kind: Secret
metadata: {name: aituan-service-secret, namespace: aituan}
type: Opaque
stringData:
  jwt-secret: replace-with-a-long-random-jwt-secret
  internal-service-token: replace-with-a-long-random-internal-token
---
# 私有 GHCR 仓库需要该 Secret；e30= 仅表示空 JSON 占位，部署前必须替换。
apiVersion: v1
kind: Secret
metadata: {name: ghcr-pull-secret, namespace: aituan}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30=
