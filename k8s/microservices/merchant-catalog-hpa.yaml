apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: merchant-catalog-service
  namespace: aituan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: merchant-catalog-service
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
