apiVersion: v1
kind: Service
metadata: {name: merchant-catalog-service, namespace: aituan}
spec:
  selector: {app.kubernetes.io/name: merchant-catalog-service, app.kubernetes.io/part-of: aituan}
  ports: [{name: http, port: 8082, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: merchant-catalog-service, namespace: aituan}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: merchant-catalog-service, app.kubernetes.io/part-of: aituan}
  template:
    metadata:
      labels: {app.kubernetes.io/name: merchant-catalog-service, app.kubernetes.io/part-of: aituan, app.kubernetes.io/component: catalog}
    spec:
      imagePullSecrets: [{name: ghcr-pull-secret}]
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36.1
          command: [sh, -ec, "until nc -z -w 2 mysql 3306; do sleep 2; done"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
      containers:
        - name: merchant-catalog-service
          image: ghcr.io/puaa-team/aituan/merchant-catalog-service:sha-placeholder
          ports: [{name: http, containerPort: 8082}]
          envFrom: [{configMapRef: {name: aituan-microservices-config}}]
          env:
            - {name: SERVER_PORT, value: "8082"}
            - {name: MERCHANT_DB_URL, value: "jdbc:mysql://mysql:3306/aituan_merchant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"}
            - {name: MERCHANT_DB_DRIVER, value: com.mysql.cj.jdbc.Driver}
            - name: MERCHANT_DB_USERNAME
              valueFrom: {secretKeyRef: {name: aituan-merchant-db-secret, key: username}}
            - name: MERCHANT_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: aituan-merchant-db-secret, key: password}}
            - name: AITUAN_JWT_SECRET
              valueFrom: {secretKeyRef: {name: aituan-service-secret, key: jwt-secret}}
            - name: AITUAN_INTERNAL_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: aituan-service-secret, key: internal-service-token}}
            - {name: AITUAN_IMAGE_TAG, value: sha-placeholder}
          startupProbe: &merchantProbe {httpGet: {path: /actuator/health, port: http}, timeoutSeconds: 3, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: *merchantProbe
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, initialDelaySeconds: 45, timeoutSeconds: 3, failureThreshold: 5, periodSeconds: 20}
          resources:
            requests: {cpu: 75m, memory: 128Mi}
            limits: {cpu: 750m, memory: 384Mi}
          volumeMounts:
            - {name: app-config, mountPath: /app/.config, subPath: .config, readOnly: true}
      volumes:
        - name: app-config
          secret: {secretName: aituan-app-config}
