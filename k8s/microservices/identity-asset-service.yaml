apiVersion: v1
kind: Service
metadata: {name: identity-asset-service, namespace: aituan}
spec:
  selector: {app.kubernetes.io/name: identity-asset-service, app.kubernetes.io/part-of: aituan}
  ports: [{name: http, port: 8081, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: identity-asset-service, namespace: aituan}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: identity-asset-service, app.kubernetes.io/part-of: aituan}
  template:
    metadata:
      labels: {app.kubernetes.io/name: identity-asset-service, app.kubernetes.io/part-of: aituan, app.kubernetes.io/component: identity}
    spec:
      imagePullSecrets: [{name: ghcr-pull-secret}]
      containers:
        - name: identity-asset-service
          image: ghcr.io/puaa-team/aituan/identity-asset-service:sha-placeholder
          ports: [{name: http, containerPort: 8081}]
          envFrom: [{configMapRef: {name: aituan-microservices-config}}]
          env:
            - {name: SERVER_PORT, value: "8081"}
            - {name: AITUAN_IDENTITY_DB_URL, value: "jdbc:mysql://mysql:3306/aituan_identity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"}
            - {name: AITUAN_IDENTITY_DB_DRIVER, value: com.mysql.cj.jdbc.Driver}
            - name: AITUAN_IDENTITY_DB_USERNAME
              valueFrom: {secretKeyRef: {name: aituan-identity-db-secret, key: username}}
            - name: AITUAN_IDENTITY_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: aituan-identity-db-secret, key: password}}
            - name: AITUAN_JWT_SECRET
              valueFrom: {secretKeyRef: {name: aituan-service-secret, key: jwt-secret}}
            - name: AITUAN_INTERNAL_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: aituan-service-secret, key: internal-service-token}}
            - {name: AITUAN_TRADE_SERVICE_URL, value: http://trade-fulfillment-service:8083}
            - {name: AITUAN_PLATFORM_SERVICE_URL, value: http://engagement-platform-service:8084}
            - {name: AITUAN_IMAGE_TAG, value: sha-placeholder}
          startupProbe: &identityProbe {httpGet: {path: /actuator/health, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: *identityProbe
          livenessProbe: {httpGet: {path: /actuator/health, port: http}, initialDelaySeconds: 45, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 750m, memory: 768Mi}
