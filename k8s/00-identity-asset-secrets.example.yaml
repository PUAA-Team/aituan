apiVersion: v1
kind: Secret
metadata:
  name: identity-asset-db-secret
  namespace: aituan
type: Opaque
stringData:
  url: jdbc:mysql://mysql-host:3306/aituan_identity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  username: identity_app
  password: replace-with-strong-password
---
apiVersion: v1
kind: Secret
metadata:
  name: aituan-jwt-secret
  namespace: aituan
type: Opaque
stringData:
  jwt-secret: replace-with-at-least-32-random-characters
---
apiVersion: v1
kind: Secret
metadata:
  name: aituan-internal-service-secret
  namespace: aituan
type: Opaque
stringData:
  token: replace-with-shared-internal-service-token
