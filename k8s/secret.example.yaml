# 示例文件：只用于说明需要哪些 Secret，不要直接在生产集群使用这些占位值。
# 真实密码、JWT secret、SMTP 授权码、证书私钥、kubeconfig 和 GHCR token 不得提交到 Git。
apiVersion: v1
kind: Secret
metadata:
  name: aituan-db-secret
  namespace: aituan
type: Opaque
stringData:
  MYSQL_USER: aituan
  MYSQL_PASSWORD: change-me
  MYSQL_ROOT_PASSWORD: change-me-root
---
apiVersion: v1
kind: Secret
metadata:
  name: aituan-app-config
  namespace: aituan
type: Opaque
stringData:
  .config: |
    aituan.security.jwt-secret=change-me-to-a-long-random-secret
    aituan.mail.enabled=false
    aituan.mail.debug-return-code=false
---
apiVersion: v1
kind: Secret
metadata:
  name: aituan-merchant-db
  namespace: aituan
type: Opaque
stringData:
  url: jdbc:mysql://mysql:3306/aituan_merchant?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  username: aituan_merchant_svc
  password: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: aituan-internal-secret
  namespace: aituan
type: Opaque
stringData:
  service-token: change-me-internal-token
