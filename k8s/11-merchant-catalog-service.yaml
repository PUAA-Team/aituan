apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-catalog-service
  namespace: aituan
  labels:
    app: merchant-catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: merchant-catalog-service
  template:
    metadata:
      labels:
        app: merchant-catalog-service
    spec:
      containers:
        - name: merchant-catalog-service
          image: ghcr.io/puaa-team/aituan/merchant-catalog-service:sha-placeholder
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: AITUAN_MERCHANT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: merchant-catalog-db-secret
                  key: url
            - name: AITUAN_MERCHANT_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: merchant-catalog-db-secret
                  key: username
            - name: AITUAN_MERCHANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: merchant-catalog-db-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-catalog-service
  namespace: aituan
spec:
  selector:
    app: merchant-catalog-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
