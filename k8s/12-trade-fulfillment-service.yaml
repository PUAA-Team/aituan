apiVersion: v1
kind: Service
metadata:
  name: trade-fulfillment-service
  namespace: aituan
  labels:
    app.kubernetes.io/name: trade-fulfillment-service
    app.kubernetes.io/part-of: aituan
    app.kubernetes.io/component: trade
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8083
      targetPort: http
  selector:
    app.kubernetes.io/name: trade-fulfillment-service
    app.kubernetes.io/part-of: aituan
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aituan-trade-fulfillment-service
  namespace: aituan
  labels:
    app.kubernetes.io/name: trade-fulfillment-service
    app.kubernetes.io/part-of: aituan
    app.kubernetes.io/component: trade
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: trade-fulfillment-service
      app.kubernetes.io/part-of: aituan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trade-fulfillment-service
        app.kubernetes.io/part-of: aituan
        app.kubernetes.io/component: trade
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: trade-fulfillment-service
          image: ghcr.io/puaa-team/aituan/trade-fulfillment-service:sha-example
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: MYSQL_DATABASE
              value: aituan_trade
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: SPRING_PROFILES_ACTIVE
            - name: TRADE_DB_URL
              value: "jdbc:mysql://mysql:3306/$(MYSQL_DATABASE)?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
            - name: TRADE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: aituan-trade-db-secret
                  key: MYSQL_USER
            - name: TRADE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aituan-trade-db-secret
                  key: MYSQL_PASSWORD
            - name: AITUAN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aituan-trade-db-secret
                  key: AITUAN_JWT_SECRET
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: JAVA_TOOL_OPTIONS
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: aituan-config
                  key: TZ
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
