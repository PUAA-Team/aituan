apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-fulfillment-service
  namespace: aituan
  labels:
    app: trade-fulfillment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-fulfillment-service
  template:
    metadata:
      labels:
        app: trade-fulfillment-service
    spec:
      containers:
        - name: trade-fulfillment-service
          image: ghcr.io/puaa-team/aituan/trade-fulfillment-service:sha-placeholder
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: AITUAN_TRADE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: trade-fulfillment-db-secret
                  key: url
            - name: AITUAN_TRADE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trade-fulfillment-db-secret
                  key: username
            - name: AITUAN_TRADE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trade-fulfillment-db-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trade-fulfillment-service
  namespace: aituan
spec:
  selector:
    app: trade-fulfillment-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
